# Keys managed by testserver/setup.sh. They are merged into work/server.properties on every
# setup run; Paper adds every other key with its default on first start.
# @RCON_PASSWORD@ is replaced with the random password kept in work/.rcon-password.

# --- local only ---
server-ip=127.0.0.1
server-port=25566
online-mode=false
enforce-secure-profile=false
enable-query=false
enable-rcon=true
rcon.port=25576
rcon.password=@RCON_PASSWORD@
broadcast-rcon-to-ops=false
enable-status=true
prevent-proxy-connections=false
max-players=8
white-list=false
motd=zenith-mapslopbot local test server (1.21.11, Grim, Via)

# --- world ---
level-name=world
allow-nether=false
spawn-protection=0
gamemode=survival
force-gamemode=true
difficulty=hard
hardcore=false
allow-flight=false

# --- 2b2t-like distances ---
# 2b2t's exact values are not published; 8/6 are plausible guesses. Raise or lower to taste.
view-distance=8
simulation-distance=6

# --- behaviour ---
# Never pause ticking while empty: RCON stocking and piston clears must run with no player online.
pause-when-empty-seconds=-1
sync-chunk-writes=true
